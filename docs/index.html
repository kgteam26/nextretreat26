<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e3da">
<title>가을 수련회 2026</title>
<style>
  :root {
    --paper: #e8e3da;
    --line: #d3ccbf;
    --card: #f6f3ee;
    --ink: #1c1b19;
    --ink-soft: #55524c;
    --coral: #d97268;
    --green: #78966a;
    --teal: #519f9b;
    --butter: #f7edcc;
    --sage: #dce6d4;
    --margin: #c0645c;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1d1c1a;
      --line: #2e2c29;
      --card: #272522;
      --ink: #efebe4;
      --ink-soft: #aba59b;
      --butter: #3a3524;
      --sage: #2a3326;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  .tape {
    display: inline-block;
    padding: 4px 14px;
    font-weight: 700;
    color: #1c1b19;
    font-size: 14px;
  }
  .tape.coral { background: var(--coral); }
  .tape.green { background: var(--green); }
  .tape.teal  { background: var(--teal); }

  /* Hero */
  header { text-align: center; padding: 48px 0 28px; }
  header .tape.coral { transform: rotate(-6deg); margin-bottom: 14px; }
  header h1 { font-size: 44px; line-height: 1.1; margin: 4px 0 14px; letter-spacing: -1px; }
  header .tags { display: flex; justify-content: center; gap: 8px; }
  header .tags .teal { transform: rotate(-6deg); }
  header .dates { margin-top: 14px; color: var(--ink-soft); font-size: 14px; }

  /* Now card */
  .now {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 20px;
    border-left: 6px solid var(--coral);
  }
  .now .label { font-size: 12px; font-weight: 700; color: var(--coral); letter-spacing: .5px; }
  .now .title { font-size: 22px; font-weight: 800; margin: 2px 0; }
  .now .time { color: var(--ink-soft); font-size: 14px; }
  .now .next { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--ink-soft); }
  .now .next b { color: var(--ink); }
  .now[hidden] { display: none; }

  /* Tabs */
  .tabs {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px 0;
    background: var(--paper);
  }
  .tabs button {
    font: inherit; font-size: 14px; font-weight: 700;
    border: 0; border-radius: 10px;
    padding: 10px 0;
    background: var(--card); color: var(--ink-soft);
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .tabs button small { display: block; font-size: 11px; font-weight: 500; }
  .tabs button[aria-selected="true"] { color: #1c1b19; }
  .tabs button[data-tab="info"][aria-selected="true"] { background: var(--coral); }
  .tabs button[data-tab="fri"][aria-selected="true"] { background: var(--green); }
  .tabs button[data-tab="sat"][aria-selected="true"] { background: var(--teal); }
  .tabs button[data-tab="sun"][aria-selected="true"] { background: #c9a960; }

  section[hidden] { display: none; }
  h2 { margin: 14px 0 12px; }
  h2 .tape { font-size: 20px; padding: 6px 18px; transform: rotate(-2deg); }

  /* Info list */
  .notice { list-style: none; padding: 0; margin: 0; }
  .notice li {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: baseline; font-size: 17px;
  }
  .notice .n { font-weight: 800; color: var(--coral); font-variant-numeric: tabular-nums; }

  /* Schedule */
  .timeline { list-style: none; padding: 0; margin: 0; position: relative; }
  .item {
    display: grid; grid-template-columns: 64px 1fr; gap: 12px;
    margin-bottom: 8px;
  }
  .item .t {
    text-align: right; font-size: 13px; font-weight: 700;
    color: var(--ink-soft); padding-top: 13px;
    font-variant-numeric: tabular-nums;
  }
  .item .box {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    padding: 11px 14px; border-left: 5px solid transparent;
  }
  .item .name { font-weight: 700; font-size: 16px; }
  .item .range { font-size: 13px; color: var(--ink-soft); }
  .item .note { font-size: 14px; margin-top: 6px; color: var(--ink); }
  .item .note ul { margin: 4px 0 0; padding-left: 18px; }
  .item.meal .box { background: var(--butter); }
  .item.worship .box { background: var(--sage); }
  .item.group .box { border-left-color: var(--teal); }
  .item.activity .box { border-left-color: var(--coral); }
  .item.past { opacity: .45; }
  .item.current .box { outline: 3px solid var(--coral); outline-offset: 0; }
  .item.current .t { color: var(--coral); }
  .item.current .name::after {
    content: "지금"; margin-left: 8px; font-size: 11px; vertical-align: 2px;
    background: var(--coral); color: #1c1b19; padding: 2px 7px; border-radius: 999px;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-soft); margin: 4px 0 14px; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: 4px; vertical-align: -1px; background: var(--c);
  }
  footer { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tape coral">가을 수련회</span>
    <h1>NExT 2026</h1>
    <div class="tags">
      <span class="tape green">2026</span>
      <span class="tape teal">NExT</span>
    </div>
    <div class="dates">11월 13일 (금) – 11월 15일 (일)</div>
  </header>

  <div class="now" id="now" hidden>
    <div class="label" id="nowLabel">지금</div>
    <div class="title" id="nowTitle"></div>
    <div class="time" id="nowTime"></div>
    <div class="next" id="nowNext"></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="info">안내<small>Info</small></button>
    <button role="tab" data-tab="fri">금<small>11/13</small></button>
    <button role="tab" data-tab="sat">토<small>11/14</small></button>
    <button role="tab" data-tab="sun">일<small>11/15</small></button>
  </nav>

  <section id="tab-info">
    <h2><span class="tape coral">안내사항</span></h2>
    <ul class="notice">
      <li><span class="n">01</span><span>커미티와 소통</span></li>
      <li><span class="n">02</span><span>시간 지키기</span></li>
      <li><span class="n">03</span><span>개인 행동 및 외출 금지</span></li>
      <li><span class="n">04</span><span>준비물: 돗자리 &amp; 따뜻한 옷!</span></li>
    </ul>
  </section>

  <section id="tab-fri" hidden>
    <h2><span class="tape green">금요일</span></h2>
    <ol class="timeline" data-day="fri"></ol>
  </section>
  <section id="tab-sat" hidden>
    <h2><span class="tape teal">토요일</span></h2>
    <ol class="timeline" data-day="sat"></ol>
  </section>
  <section id="tab-sun" hidden>
    <h2><span class="tape" style="background:#c9a960">일요일</span></h2>
    <ol class="timeline" data-day="sun"></ol>
  </section>

  <footer>가을 수련회 2026</footer>
</div>

<script>
// type: meal | worship | group | activity | (blank)
const DAYS = {
  fri: { date: "2026-11-13", label: "금요일", items: [
    ["17:30", "19:30", "교회에서 출발", "activity"],
    ["19:30", "20:00", "도착 / 등록"],
    ["20:00", "22:00", "예배", "worship"],
    ["22:00", "22:30", "광고 / OT", "worship"],
    ["22:30", "23:30", "조모임", "group", ["멤버 웰컴키트", "아이스브레이킹", "예배 나눔 질문"]],
    ["23:30", "24:00", "교제 / 숙소로 이동"],
    ["24:00", null, "취침"],
  ]},
  sat: { date: "2026-11-14", label: "토요일", items: [
    ["07:00", "07:30", "기상"],
    ["07:30", "08:00", "걸어서 말씀속으로", "activity", "오전 산책 — 조별로 말씀 암송"],
    ["08:00", "09:00", "아침", "meal"],
    ["09:00", "09:30", "찬양", "worship"],
    ["09:30", "11:00", "순간포착 성경의 그날", "activity", "오전 액티비티 — 2조가 한 팀"],
    ["11:00", "12:30", "세미나", "", ["Session 1: 11:00 – 11:40", "Session 2: 11:50 – 12:30"]],
    ["12:30", "13:30", "점심", "meal"],
    ["13:30", "14:30", "조모임", "group", "세미나 나눔"],
    ["14:30", "16:30", "가을 운동회", "activity", "가급적 모두 참여!"],
    ["16:30", "17:30", "자유시간"],
    ["17:30", "18:30", "저녁", "meal"],
    ["18:30", "19:00", "단체 촬영"],
    ["19:00", "21:00", "예배", "worship"],
    ["21:00", "22:00", "기도", "worship"],
    ["22:00", "23:00", "조모임 / burn 죄", "group", "캠프파이어 🔥"],
    ["23:00", "24:00", "교제 / 숙소로 이동"],
    ["24:00", null, "취침"],
  ]},
  sun: { date: "2026-11-15", label: "일요일", items: [
    ["07:00", "07:30", "기상"],
    ["07:30", "08:00", "걸어서 말씀속으로", "activity", "조별로 말씀 암송"],
    ["08:00", "09:00", "아침", "meal"],
    ["09:00", "09:30", "짐정리"],
    ["09:30", "11:30", "예배", "worship"],
    ["11:30", "12:30", "타임캡슐 / 피드백", "group"],
    ["12:30", "13:30", "점심", "meal"],
    ["13:30", "14:30", "조모임 / 사진", "group"],
    ["14:30", null, "교회로 출발", "activity"],
  ]},
};

const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmt = s => {
  let [h, m] = s.split(":").map(Number);
  if (h === 24) return "밤 12:00";
  const ap = h < 12 ? "오전" : "오후";
  const hh = h % 12 || 12;
  return `${ap} ${hh}:${String(m).padStart(2, "0")}`;
};
const short = s => { let h = Number(s.split(":")[0]) % 12 || 12; return `${h}:${s.split(":")[1]}`; };

// Build absolute start/end timestamps; open-ended items run until the next one (or 30 min).
const all = [];
for (const [key, day] of Object.entries(DAYS)) {
  const base = new Date(day.date + "T00:00:00").getTime();
  day.items.forEach((it, i) => {
    const [s, e, name, type = "", note] = it;
    const start = base + toMin(s) * 60000;
    const nextStart = day.items[i + 1] ? base + toMin(day.items[i + 1][0]) * 60000 : start + 30 * 60000;
    const end = e ? base + toMin(e) * 60000 : nextStart;
    all.push({ key, s, e, name, type, note, start, end });
  });
}

// Render timelines
for (const ol of document.querySelectorAll(".timeline")) {
  const key = ol.dataset.day;
  ol.insertAdjacentHTML("beforebegin", `<div class="legend">
    <span style="--c:var(--sage)">예배</span><span style="--c:var(--butter)">식사</span>
    <span style="--c:var(--teal)">조모임</span><span style="--c:var(--coral)">액티비티</span></div>`);
  for (const it of all.filter(x => x.key === key)) {
    const li = document.createElement("li");
    li.className = `item ${it.type}`;
    let note = "";
    if (Array.isArray(it.note)) note = `<div class="note"><ul>${it.note.map(n => `<li>${n}</li>`).join("")}</ul></div>`;
    else if (it.note) note = `<div class="note">${it.note}</div>`;
    li.innerHTML = `<div class="t">${short(it.s)}</div>
      <div class="box"><div class="name">${it.name}</div>
      <div class="range">${it.e ? `${fmt(it.s)} – ${fmt(it.e)}` : fmt(it.s)}</div>${note}</div>`;
    it.el = li;
    ol.appendChild(li);
  }
}

// Tabs
const tabs = [...document.querySelectorAll(".tabs button")];
function show(tab, scroll) {
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("section").forEach(s => s.hidden = s.id !== "tab-" + tab);
  try { localStorage.setItem("tab", tab); } catch (e) {}
  if (scroll) {
    const cur = document.querySelector(`#tab-${tab} .item.current`);
    if (cur) cur.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.tab, true)));

// "Now" — add ?now=2026-11-14T15:00 to the URL to preview a moment
const override = new URLSearchParams(location.search).get("now");
const getNow = () => override ? new Date(override).getTime() : Date.now();

function tick() {
  const now = getNow();
  let current = null;
  for (const it of all) {
    it.el.classList.toggle("past", it.end <= now);
    const isCur = it.start <= now && now < it.end;
    it.el.classList.toggle("current", isCur);
    if (isCur) current = it;
  }
  const next = all.find(it => it.start > now);
  const box = document.getElementById("now");
  const first = all[0], last = all[all.length - 1];
  if (now < first.start || now >= last.end) { box.hidden = true; return null; }
  box.hidden = false;
  if (current) {
    document.getElementById("nowLabel").textContent = "지금";
    document.getElementById("nowTitle").textContent = current.name;
    document.getElementById("nowTime").textContent = current.e ? `${fmt(current.s)} – ${fmt(current.e)}` : fmt(current.s);
  } else {
    document.getElementById("nowLabel").textContent = "잠시 쉬는 시간";
    document.getElementById("nowTitle").textContent = "푹 쉬세요 🌙";
    document.getElementById("nowTime").textContent = "";
  }
  const nx = document.getElementById("nowNext");
  if (next) {
    const mins = Math.round((next.start - now) / 60000);
    const inTxt = mins < 60 ? `${mins}분 후` : `${Math.floor(mins / 60)}시간 ${mins % 60 ? (mins % 60) + "분 " : ""}후`;
    nx.innerHTML = `다음: <b>${next.name}</b> · ${fmt(next.s)} (${inTxt})`;
    nx.hidden = false;
  } else nx.hidden = true;
  return current || next;
}

const focus = tick();
let start = "info";
if (focus) start = focus.key;
else { try { start = localStorage.getItem("tab") || "info"; } catch (e) {} }
show(start, !!focus);
setInterval(tick, 30000);
</script>
</body>
</html>
